server {
    listen 443 ssl;
    server_name srv1934103.hstgr.cloud;
    ssl_certificate /etc/nginx/tls/srv1934103.hstgr.cloud.crt;
    ssl_certificate_key /etc/nginx/tls/srv1934103.hstgr.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NFSSL:1m;
    server_tokens off;

    location / {
        proxy_pass http://app:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
