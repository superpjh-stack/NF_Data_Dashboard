name: nf-data-dashboard
services:
  app:
    image: nf-data-dashboard-app:${APP_VERSION:-latest}
    build:
      context: ${RELEASE_DIR:-.}
    container_name: nf-data-dashboard-app
    restart: unless-stopped
    environment:
      DASHBOARD_AUTH_REQUIRED: "1"
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER in .env}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}
      SOURCE_ROOT: /sources
      TZ: Asia/Seoul
    expose:
      - "8770"
    volumes:
      - ${RELEASE_DIR:-.}/data:/app/data:ro
      - ${RELEASE_DIR:-.}/reports:/app/reports:ro
      - ${RELEASE_DIR:-.}/originals:/sources:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 128

  gateway:
    image: nginx:stable-alpine
    container_name: nf-data-dashboard-gateway
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8770}:443"
    volumes:
      - ${RELEASE_DIR:-.}/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY in .env}:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://app:8770/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
